<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 학습 대시보드</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 16px; display: flex; justify-content: center; }
    .container { max-width: 860px; width: 100%; display: flex; flex-direction: column; gap: 16px; }

    .config-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
    .config-box input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; outline: none; }
    .config-box button { background: var(--primary); color: #fff; padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .config-box button:hover { background: var(--primary-hover); }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px 20px; border-radius: 10px; border: 1px solid var(--border); }
    .day-badge { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .header-controls { display: flex; gap: 8px; }

    button.btn-ctrl { background: #f1f5f9; color: var(--text); padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-ctrl:hover { background: #e2e8f0; }

    .section-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 18px; position: relative; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .seen-badge { font-size: 0.78rem; font-weight: normal; color: var(--text-sub); background: #f1f5f9; padding: 2px 8px; border-radius: 10px; }

    .btn-refresh { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; border-radius: 6px; padding: 5px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-refresh:hover { background: #dbeafe; }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

    .list-grid { display: flex; flex-direction: column; gap: 8px; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 6px; background: #fafbfc; border: 1px solid var(--border); }
    .item-card.ch { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }

    .item-left { display: flex; flex-direction: column; gap: 2px; }
    .term { font-weight: 700; font-size: 0.96rem; }
    .desc { font-size: 0.88rem; color: var(--text-sub); }

    .hanja-box { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
    .hanja-unit { background: #fff; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.82rem; }
    .hanja-char { font-weight: 700; color: #b45309; }

    .loader { font-size: 0.88rem; color: var(--primary); font-weight: 600; padding: 12px 0; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="config-box">
    <span style="font-size:0.9rem; font-weight:700;">Gemini API Key:</span>
    <input type="password" id="apiKeyInput" placeholder="발급받은 키를 여기에 붙여넣으세요">
    <button onclick="saveApiKey()">저장</button>
  </div>

  <header>
    <div class="day-badge" id="dayDisplay">Day 1</div>
    <div class="header-controls">
      <button class="btn-ctrl" onclick="changeDay(-1)">◀ 이전 Day</button>
      <button class="btn-ctrl" onclick="changeDay(1)">다음 Day ▶</button>
      <button class="btn-ctrl" style="background:#fee2e2; color:#991b1b;" onclick="resetSeenHistory()">학습기록 초기화</button>
    </div>
  </header>

  <!-- 영어 10개 -->
  <section class="section-card">
    <div class="section-header">
      <div class="section-title">
        영단어 (대학·학술 수준 10개)
        <span class="seen-badge" id="enSeenCount">누적 제외: 0개</span>
      </div>
      <button class="btn-refresh" id="btn-en" onclick="fetchCategoryData('en')">새로고침 ↺</button>
    </div>
    <div class="list-grid" id="enList"></div>
  </section>

  <!-- 사자성어 2개 -->
  <section class="section-card">
    <div class="section-header">
      <div class="section-title">
        사자성어 (2개)
        <span class="seen-badge" id="chSeenCount">누적 제외: 0개</span>
      </div>
      <button class="btn-refresh" id="btn-ch" onclick="fetchCategoryData('ch')">새로고침 ↺</button>
    </div>
    <div class="list-grid" id="chList"></div>
  </section>
</div>

<script>
  let apiKey = localStorage.getItem('gemini_api_key') || '';
  let currentDay = parseInt(localStorage.getItem('study_day'), 10) || 1;

  let seen = {
    en: JSON.parse(localStorage.getItem('seen_en') || '[]'),
    ch: JSON.parse(localStorage.getItem('seen_ch') || '[]')
  };

  function saveApiKey() {
    const input = document.getElementById('apiKeyInput').value.trim();
    if (!input) return alert('API Key를 입력해주세요.');
    apiKey = input;
    localStorage.setItem('gemini_api_key', apiKey);
    alert('API Key가 저장되었습니다. 학습을 시작합니다.');
    loadDay();
  }

  function updateBadgeCounts() {
    document.getElementById('enSeenCount').innerText = `누적 제외: ${seen.en.length}개`;
    document.getElementById('chSeenCount').innerText = `누적 제외: ${seen.ch.length}개`;
  }

  function resetSeenHistory() {
    if (!confirm('지금까지 본 단어 제외 목록을 초기화할까요?')) return;
    seen = { en: [], ch: [] };
    localStorage.removeItem('seen_en');
    localStorage.removeItem('seen_ch');
    updateBadgeCounts();
    loadDay();
  }

  async function callGemini(promptText) {
    if (!apiKey) throw new Error('API Key가 필요합니다.');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: { responseMimeType: "application/json" }
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || '요청 실패');
    }

    const data = await response.json();
    return JSON.parse(data.candidates[0].content.parts[0].text);
  }

  async function fetchCategoryData(type) {
    if (!apiKey) {
      alert('상단에 Gemini API Key를 먼저 입력하고 [저장]을 눌러주세요.');
      return;
    }

    const btn = document.getElementById(`btn-${type}`);
    const list = document.getElementById(`${type}List`);
    btn.disabled = true;
    list.innerHTML = '<div class="loader">중복 단어를 제외하고 새로 생성하는 중...</div>';

    let prompt = '';
    const excludeList = seen[type].slice(-100);

    if (type === 'en') {
      prompt = `
당신은 대학 어휘 전문가입니다. 4년제 대학교 학술 교재, 논문, GRE/TOEFL에 등장하는 고급 영단어 10개를 JSON 배열로 출력하세요.
다음 단어들은 이미 학습했으므로 절대 포함하지 마세요: [${excludeList.join(', ')}]
JSON 포맷 예시:
[
  {"t": "Ambiguous", "d": "애매모호한, 두 가지 이상의 해석이 가능한"}
]`;
    } else if (type === 'ch') {
      prompt = `
사자성어 2개를 선정하세요. 각 한자 4글자의 음훈(뜻과 소리)과 사자성어의 전체 의미를 제공하세요.
다음 사자성어는 이미 학습했으므로 절대 포함하지 마세요: [${excludeList.join(', ')}]
JSON 포맷 예시:
[
  {
    "t": "日進月步 (일취월장)",
    "breakdown": [
      {"c": "日", "m": "날 일"},
      {"c": "進", "m": "나아갈 진"},
      {"c": "月", "m": "달 월"},
      {"c": "步", "m": "걸음 보"}
    ],
    "d": "날마다 나아가고 달마다 걸음을 뗀다는 뜻으로, 쉬지 않고 크게 발전함을 이르는 말."
  }
]`;
    }

    try {
      const items = await callGemini(prompt);
      renderCategory(type, items);

      items.forEach(item => seen[type].push(item.t));
      localStorage.setItem(`seen_${type}`, JSON.stringify(seen[type]));
      updateBadgeCounts();
    } catch (e) {
      list.innerHTML = `<div style="color:#ef4444; padding:10px; font-size:0.88rem;">생성 실패: ${e.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderCategory(type, items) {
    const list = document.getElementById(`${type}List`);
    list.innerHTML = '';

    items.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = `item-card ${type}`;

      if (type === 'ch') {
        const breakdownHtml = (item.breakdown || []).map(b => 
          `<div class="hanja-unit"><span class="hanja-char">${b.c}</span>: ${b.m}</div>`
        ).join('');

        card.innerHTML = `
          <div class="term" style="font-size:1.05rem;">${index + 1}. ${item.t}</div>
          <div class="hanja-box">${breakdownHtml}</div>
          <div class="desc" style="margin-top:4px;"><strong>뜻:</strong> ${item.d}</div>
        `;
      } else {
        card.innerHTML = `
          <div class="item-left">
            <span class="term">${index + 1}. ${item.t}</span>
            <span class="desc">${item.d}</span>
          </div>
        `;
      }
      list.appendChild(card);
    });
  }

  function changeDay(delta) {
    currentDay = Math.max(1, currentDay + delta);
    localStorage.setItem('study_day', currentDay);
    document.getElementById('dayDisplay').innerText = `Day ${currentDay}`;
    loadDay();
  }

  // 동시 호출 제한을 피하기 위해 1초 간격을 두고 순차 호출
  async function loadDay() {
    if (!apiKey) return;
    await fetchCategoryData('en');
    await new Promise(resolve => setTimeout(resolve, 1000));
    await fetchCategoryData('ch');
  }

  window.onload = function() {
    if (apiKey) {
      document.getElementById('apiKeyInput').value = apiKey;
      loadDay();
    }
    document.getElementById('dayDisplay').innerText = `Day ${currentDay}`;
    updateBadgeCounts();
  };
</script>
</body>
</html>
